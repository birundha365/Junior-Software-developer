<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamNest Interiors | Home Interior Design</title>
    <style>
        *{
          margin:0;
          padding:0;
          box-sizing:border-box;
          font-family: Arial, Helvetica, sans-serif;
        }
        html{
            scroll-behavior:smooth;
        }
        body{
            background: #faf8f5;
            color:#333;
        }

        /*NAVBAR*/
        nav{
            position: sticky;
            top:0;
            z-index: index 1000;
            background: #222;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav h2{
            color: #fff;
        }
        nav span{
            color:#d9a066;
        }
        nav a{
            color:aliceblue;
            text-decoration: none;
            margin-left: 18px;
            font-size: 14px;
        }
        nav a:hover{
            color:#d9a066;
        }

        /*HERO*/

        .hero{
            min-height: 650px;
            background: linear-gradient(rgba(0,0,0,.55))
            url("http://images.unsplash.com/photo-160021492486-724fe5c67fb0?auto=format&fit=crop&w=1800&q=85");

        }

    </style>
</head>

</html>
