<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
    function colors(){
        document.bgColor=event.target.value;
    }
    </script>
</head>
<body>
    <h1><center>Change Background color:</center></h1>
    <label>Select color:</label>
    <pre>        
                  <input type="radio" onchange="colors()" name="col" value="red">red<br>
                  <input type="radio" onchange="colors()" name="col" value="green">green<br>
                  <input type="radio" onchange="colors()" name="col" value="pink">pink<br>
                  <input type="radio" onchange="colors()" name="col" value="blue">blue<br>
                  <input type="radio" onchange="colors()" name="col" value="orange">orange<br>
                  <input type="radio" onchange="colors()" name="col" value="black">black<br>
                  <input type="radio" onchange="colors()" name="col" value="purple">purple<br>
    </pre>


</body>
</html>
