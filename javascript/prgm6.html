<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
         function images1(){
         document.getElementById("myimg").src="./images/"+event.target.value+".jpg";
    }
    </script>
</head>
<body>
    <h1><center>Display images:</center></h1>
    <label>Select image:</label>
    <pre>        
                  <input type="radio" onchange="images1()" name="img" value="panda  a">panda a<br>
                  <input type="radio" onchange="images1()" name="img" value="panda b">panda b<br>
                  <input type="radio" onchange="images1()" name="img" value="panda c">panda c<br>
                 
    </pre>
    <br>
    <center>
        <img src="" width="20%" id="myimg">
    </center>

    
</body>
</html>
