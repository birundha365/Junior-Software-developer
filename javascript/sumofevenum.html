<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Even Sum</title>

    <script type="text/javascript">
        var arr = [10, 21, 30, 45, 50];
        var size = arr.length;
        var esum = 0;

        for (var i = 0; i < size; i++) {
            if (arr[i] % 2 === 0) {
                esum = esum + arr[i];
            }
        }

        document.write("<br>Sum of even numbers: " + esum);
    </script>
</head>
<body>
</body>
</html>
